[workspace]
members = [
    "crates/cloud_sync_lib",
    "crates/cloud_sync_daemon",
    "crates/cloud_sync_ui",
    "crates/cloud_sync_tauri",
    "crates/cloud_sync_egui",
    "crates/cloud_sync_backup",
    "crates/cloud_sync_core",
    "crates/cloud_sync_std",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["Rob Tizzard <robt@example.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/clockworkengineer/cloud_sync_lib"
homepage = "https://github.com/clockworkengineer/cloud_sync_lib"

[workspace.dependencies]
tokio = "1"
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
async-trait = "0.1"
tempfile = "3.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ignore = "0.4"
futures-util = "0.3"
toml = "0.8"
tracing-appender = "0.2"
keyring = "2.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }
thiserror = "1.0"
ring = "0.17"
md5 = "0.7.0"
sha1 = "0.10.6"
rand = "0.8"
filetime = "0.2"
aes-gcm = "0.10"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
async-stream = "0.3"
auto-launch = "0.5"
notify = "6.1"
reqwest = { version = "0.11", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
