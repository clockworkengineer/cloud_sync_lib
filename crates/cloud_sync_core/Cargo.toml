[package]
name = "cloud_sync_core"
version = "0.1.1"

edition = "2021"
description = "Core data structures and traits for Cloud Sync"
license = "MIT"
repository = "https://github.com/clockworkengineer/cloud_sync_lib"

[dependencies]
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.0", features = ["alloc"] }
async-trait = { workspace = true }
hashbrown = { version = "0.14", default-features = false, features = ["serde", "ahash"] }
reqwest = { version = "0.11", default-features = false, optional = true }

serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util"], optional = true }

[features]
default = ["std"]
std = ["serde/std", "hashbrown/default", "dep:reqwest", "dep:serde_json", "dep:tokio"]

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
