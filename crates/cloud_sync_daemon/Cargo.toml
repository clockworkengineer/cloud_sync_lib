[package]
name = "cloud_sync_daemon"
version.workspace = true
edition.workspace = true
description = "Background synchronization daemon for Cloud Sync"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
cloud_sync_lib = { path = "../cloud_sync_lib", version = "0.2.0", default-features = false }
tokio = { workspace = true, features = ["full"] }
notify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
ignore = { workspace = true }
futures-util = { workspace = true }
chrono = { workspace = true }
serde_json = { workspace = true }
tracing-appender = { workspace = true }

[features]
default = ["google_drive", "dropbox", "onedrive", "webdav", "s3", "sftp", "nextcloud", "box", "mega", "azure_blob", "gcs", "b2", "pcloud", "ipfs"]
google_drive = ["cloud_sync_lib/google_drive"]
dropbox = ["cloud_sync_lib/dropbox"]
onedrive = ["cloud_sync_lib/onedrive"]
webdav = ["cloud_sync_lib/webdav"]
s3 = ["cloud_sync_lib/s3"]
sftp = ["cloud_sync_lib/sftp"]
nextcloud = ["cloud_sync_lib/nextcloud"]
box = ["cloud_sync_lib/box"]
mega = ["cloud_sync_lib/mega"]
azure_blob = ["cloud_sync_lib/azure_blob"]
gcs = ["cloud_sync_lib/gcs"]
b2 = ["cloud_sync_lib/b2"]
pcloud = ["cloud_sync_lib/pcloud"]
ipfs = ["cloud_sync_lib/ipfs"]

[dev-dependencies]
tempfile = { workspace = true }
