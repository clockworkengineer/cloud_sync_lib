[package]
name = "cloud_sync_tauri"
version.workspace = true
edition.workspace = true
description = "Tauri desktop interface wrapper for Cloud Sync"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "cloud_sync_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
cloud_sync_daemon = { path = "../cloud_sync_daemon", version = "0.2.0" }
cloud_sync_lib = { path = "../cloud_sync_lib", version = "0.2.0" }
cloud_sync_core = { path = "../cloud_sync_core", version = "0.2.0" }
toml = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
cloud_sync_ui = { path = "../cloud_sync_ui", version = "0.2.0" }
tauri-plugin-shell = "2.0"
auto-launch = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
image = "0.24"
ico = "0.5"
